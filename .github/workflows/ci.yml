# CI/CD for the homelabs app.
#
# Flow: feature branch -> pull request (verify) -> merge to main (verify +
# container image). `publish-image` depends on `verify`, so no image is ever
# built from unverified code. Branch protection requires the check by NAME,
# enforceable once it has reported a first time.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/1sm1rk/homelabs-app

jobs:
  # Branch protection points at exactly this job name: keep `verify` stable.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Unit tests plus the *IT integration tests; the ITs start a Postgres
      # test container (the runner's Docker daemon) for the session store.
      - name: mvn verify
        run: mvn -B -ntp verify

  publish-image:
    name: publish-image
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute the short-commit tag
        id: tags
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.tags.outputs.short_sha }}
